name: Build test Docker image

on:
  workflow_call:
    inputs:
      hive_target:
        required: true
        type: string
        description: "Docker bake target to build (e.g. hive)"
      artifact_name:
        required: false
        type: string
        default: "artifacts"
        description: "Name for the uploaded artifact"

permissions: {}

jobs:
  docker:
    timeout-minutes: 75
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: mkdir -p artifacts
      - name: Get Git metadata
        id: git
        run: echo "describe=$(git describe --always --tags)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build reth image (Docker)
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          DEPOT_BUILD: "false"
          VERGEN_GIT_SHA: ${{ github.sha }}
          VERGEN_GIT_DESCRIBE: ${{ steps.git.outputs.describe }}
        with:
          files: docker-bake.hcl
          targets: ${{ inputs.hive_target }}
          push: false
          set: |
            *.dockerfile=Dockerfile
      - name: Upload reth image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact_name }}
          path: ./artifacts
