# Gating stock Ethereum and Cancun-profile fixtures.
name: hive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-upstream:
    if: github.repository == 'paradigmxyz/reth'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/docker-test-depot.yml
    with:
      hive_target: hive
      artifact_name: reth
    secrets:
      DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}

  build-fork:
    if: github.repository != 'paradigmxyz/reth'
    permissions:
      contents: read
    uses: ./.github/workflows/docker-test.yml
    with:
      hive_target: hive
      artifact_name: reth

  test:
    needs: [build-upstream, build-fork]
    if: >-
      !cancelled() && (needs.build-upstream.result == 'success' || needs.build-fork.result == 'success')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - {name: Genesis smoke, sim: smoke/genesis}
          - {name: Network smoke, sim: smoke/network}
          - {name: Sync, sim: ethereum/sync}
          - {name: Engine authentication, sim: ethereum/engine, limit: '^engine-auth$'}
          - {name: Engine capabilities, sim: ethereum/engine, limit: '^engine-exchange-capabilities$'}
          - name: Cancun V3 reorg
            sim: ethereum/engine
            suite: engine-cancun
            cases: cancun-reorg.txt
          - name: Paris persistence canaries
            sim: ethereum/engine
            suite: engine-api
            cases: paris-reorg.txt
          - name: Cancun Engine fixtures
            sim: ethereum/eels/consume-engine
            fixture: amsterdam
            cases: cancun-engine.txt
          - name: Cancun RLP fixtures
            sim: ethereum/eels/consume-rlp
            cases: cancun-rlp.txt
    name: ${{ matrix.scenario.name }}
    uses: ./.github/workflows/hive-simulator.yml
    with:
      sim: ${{ matrix.scenario.sim }}
      limit: ${{ matrix.scenario.limit || '/' }}
      fixture: ${{ matrix.scenario.fixture || 'osaka' }}
      cases: ${{ matrix.scenario.cases || '' }}
      suite: ${{ matrix.scenario.suite || '' }}
      profile: gate
      artifact: hive-gate-${{ strategy.job-index }}
